<!doctype html>
<html lang="en">
<head>

  <title>Donut Clients — Download</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090d15;
      --panel: rgba(17, 24, 37, .88);
      --text: #f5f7fb;
      --muted: #9ba8bc;
      --line: rgba(165, 185, 220, .14);
      --accent: #b9f477;
      --blue: #91b7ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 37%, rgba(56, 83, 136, .22), transparent 32rem),
        radial-gradient(ellipse at 10% 100%, rgba(98, 132, 65, .09), transparent 28rem),
        var(--bg);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .13;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }
    .wrap { position: relative; width: min(760px, calc(100% - 36px)); padding: 44px 0; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 28px; color: #d4deed; font-size: 13px; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; color: #18230e; background: linear-gradient(145deg, #d5ff9c, #9bdd57); box-shadow: 0 5px 22px rgba(185, 244, 119, .2); }
    .brand-mark svg { width: 18px; height: 18px; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 28px 100px rgba(0,0,0,.43); backdrop-filter: blur(18px); }
    .content { padding: 30px 34px 31px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: #a9c5ff; font-size: 10px; font-weight: 720; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 17px; height: 1px; background: var(--blue); }
    h1 { margin: 13px 0 8px; font-size: clamp(34px, 7vw, 50px); line-height: 1; letter-spacing: -.065em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 21px 0 25px; }
    .chip { padding: 7px 10px; border: 1px solid rgba(145,183,255,.17); border-radius: 999px; color: #b3c5e5; background: rgba(145,183,255,.055); font-size: 10px; }
    .chip.ready { display: inline-flex; align-items: center; gap: 7px; border-color: rgba(185,244,119,.2); color: #c5ef9b; background: rgba(185,244,119,.055); }
    .chip.ready::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .download { width: 100%; display: flex; align-items: center; justify-content: center; gap: 11px; min-height: 54px; border: 0; border-radius: 12px; color: #17210e; background: linear-gradient(110deg, #d0ff91, #a9eb65); box-shadow: 0 8px 26px rgba(166, 229, 97, .15); font-size: 14px; font-weight: 760; text-decoration: none; transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; }
    .download:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 12px 32px rgba(166, 229, 97, .22); }
    .download:focus-visible { outline: 3px solid rgba(190, 224, 255, .8); outline-offset: 3px; }
    .download svg { width: 18px; height: 18px; }
    .below { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: #8491a6; font-size: 10px; }
    @media (max-width: 540px) {
      .wrap { width: min(100% - 24px, 440px); padding: 26px 0; }
      .brand { margin-bottom: 20px; }
      .content { padding: 25px 21px 23px; }
      .below { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>

          Download Prestige Client

        <div class="below"><span>Version 1.21.11</span><span>Java Edition</span></div>

</body>
</html>
